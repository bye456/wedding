<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>준비중입니다</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      background-color: #f8f9fa;
      color: #212529;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 480px;
      background: #ffffff;
      padding: 48px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #6c757d;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      font-size: 14px;
      color: #ffffff;
      background-color: #228be6;
      text-decoration: none;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>준비중입니다</h1>
    <p>페이지를 준비하고 있습니다.<br>빠른 시일 내에 찾아뵙겠습니다.</p>
      </div>
</body>
</html>
